    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

    <script type="text/javascript">


       
        



        const MODEL_URL = "https://teachablemachine.withgoogle.com/models/CCiKWJMYH/";
        let model, maxPredictions;

        async function init() {
            const modelURL = MODEL_URL + "model.json";
            const metadataURL = MODEL_URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();
        }

        async function handleImageUpload(event) {
            const file = event.target.files[0];
            const img = document.createElement("img");
            img.onload = async function() {
                const prediction = await predict(img);
                displayPredictions(prediction);
            }
            img.src = URL.createObjectURL(file);



          
  document.getElementById("selected-image").src = URL.createObjectURL(file);




        }

        async function predict(imgElement) {
            return model.predict(imgElement);
        }

        function displayPredictions(prediction) {
            const labelContainer = document.getElementById("label-container");
            
    labelContainer.innerHTML = "";



    
    // Create a new bar chart
    const ctx = document.createElement("canvas");
    labelContainer.appendChild(ctx);
    const chart = new Chart(ctx, {
        type: 'bar',
        data: {
            
            labels: [],
            datasets: [{
                label: 'Prediction Probability',
                data: [],
                borderColor: 'black',
                backgroundColor: ['rgba(75, 192, 192, 0.9)', 'rgba(153, 102, 255, 0.9)', 'rgba(255, 159, 64, 0.9)'],
              //borderColor: ['rgba(75, 192, 192, 1)', 'rgba(153, 102, 255, 1)', 'rgba(255, 159, 64, 1)'],
              
                borderWidth: 2
                
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    borderColor: 'black'
                  
                }
                },


                plugins: {
                    legend: {
                        display: false
                        
                    }
                },
                layout: {
                    padding: {
                        left: 5,
                        right: 10,
                        borderColor: 'black',
                        top: 2,
                        bottom: 2
                        
                        
                    }
                },
                responsive: true,
                maintainAspectRatio: false,
                aspectRatio: 1,
                
                barPercentage: 0.25 // Adjust the thickness of the bars
            }
        });

    // Add the prediction data to the chart
    for (let i = 0; i < maxPredictions; i++) {
        const classPrediction = prediction[i].className + ": " + prediction[i].probability.toFixed(2);
        chart.data.labels.push(prediction[i].className);
        chart.data.datasets[0].data.push(prediction[i].probability * 100);
    }
    
    // Update the chart
    chart.update();
        }

        init();
    </script>
