<br><br>

<br>

                    <br>

            const form = document.getElementById("questionnaire");
        const result = document.getElementById("result");
        const submitBtn = document.getElementById("submit-btn");
        let yesCount = 0;

        form.addEventListener("change", (event) => {
            if (event.target.type === "radio" && event.target.value === "a") {
                yesCount++;
            } else if (event.target.type === "checkbox" && event.target.checked) {
                yesCount++;
            }
        });

        submitBtn.addEventListener("click", () => {
            if (yesCount > 10) {
                result.innerHTML = "  Result: Autistic";
            } else {
                result.innerHTML = "Result: Not Autistic";
            }
            if (yesCount > 10) {
                result.innerHTML = "       Result: Autistic";
            } else {
                result.innerHTML = "Result: Not Autistic";
            }
            result.style.display = "block"; // Show the result




            document.write(`<html><body><br><br><br><br><br><br><center><img src="images/res.png"><div style="background-color:rgb(131, 246, 242); height:5cm;width:13cm;color:blue;font-size:0.6cm;font-family:Arial;"><h1><br>${result.innerHTML}</h1></div></center></body></html>`);
